<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRAVITYSB – Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7f6;
      font-family: Arial, sans-serif;
      color: #17201f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .brand {
      text-align: center;
      font-size: 25px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .brand span {
      color: #159b69;
    }

    .subtitle {
      text-align: center;
      color: #68716f;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5ddda;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #159b69;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #159b69;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      text-align: center;
      font-size: 14px;
    }

    .links {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }

    a {
      color: #159b69;
      text-decoration: none;
      font-weight: 700;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: #68716f;
      font-weight: normal;
    }
  </style>
</head>

<body>

  <div class="signup-card">

    <div class="brand">
      KRAVITYSB <span>USDT</span>
    </div>

    <div class="subtitle">
      Create your account
    </div>

    <form id="signupForm">

      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        name="fullName"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="At least 8 characters"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        name="confirmPassword"
        placeholder="Confirm your password"
        minlength="8"
        required
      >

      <button type="submit" id="signupButton">
        Create Account
      </button>

    </form>

    <div id="message"></div>

    <div class="links">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <a class="back" href="index.html">
      ← Back to KRAVITYSB
    </a>

  </div>

  <script>
    const form = document.getElementById("signupForm");
    const button = document.getElementById("signupButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      message.style.display = "none";

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.", false);
        return;
      }

      if (password.length < 8) {
        showMessage("Password must be at least 8 characters.", false);
        return;
      }

      button.disabled = true;
      button.textContent = "Creating Account...";

      try {
        const response = await fetch("/api/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            fullName,
            email,
            password,
            confirmPassword
          })
        });

        const data = await response.json();

        if (data.success) {
          showMessage("Account created successfully! Redirecting to login...", true);

          form.reset();

          setTimeout(() => {
            window.location.href = "login.html";
          }, 1500);

        } else {
          showMessage(data.message || "Unable to create account.", false);
        }

      } catch (error) {
        showMessage("Connection error. Please try again.", false);
      }

      button.disabled = false;
      button.textContent = "Create Account";
    });

    function showMessage(text, success) {
      message.textContent = text;
      message.style.display = "block";
      message.style.background = success ? "#e7f8f0" : "#fdecec";
      message.style.color = success ? "#087443" : "#b42318";
    }
  </script>

</body>
</html>
