<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KRAVITYSB — Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7f6;
      font-family: Arial, sans-serif;
      color: #17201f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .signup-card {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .brand {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #66706f;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd4d2;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #55bdb5;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #55bdb5;
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #66706f;
    }

    .login a {
      color: #279b93;
      font-weight: 700;
      text-decoration: none;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #66706f;
      text-decoration: none;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #fff3cd;
      color: #664d03;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="signup-card">

    <div class="brand">KRAVITYSB</div>

    <div class="subtitle">
      Create your account
    </div>

    <form id="signupForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="8"
        required
      >

      <label for="confirmPassword">Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="8"
        required
      >

      <button type="submit">
        Create Account
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <a class="back" href="index.html">
      ← Back to KRAVITYSB
    </a>

  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const message = document.getElementById("message");

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.style.display = "block";
        return;
      }

      message.textContent =
        "Account system will be connected next.";

      message.style.display = "block";
    });
  </script>

</body>
</html>
